version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-portfolio-nextjs
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_portfolio_nextjs
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: